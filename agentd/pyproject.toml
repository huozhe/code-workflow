[project]
name = "agentd"
version = "0.1.0"
description = "Local orchestrator for async multi-agent AI coding (M0/M1)"
readme = "README.md"
authors = [
    { name = "huozhegrok", email = "huozhe.grok@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
agentd = "agentd.__main__:main"
agentctl = "agentctl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentd", "src/agentctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
