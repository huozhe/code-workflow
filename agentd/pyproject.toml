[project]
name = "agentd"
version = "0.1.0"
description = "Local orchestrator for async multi-agent AI coding (M0–M3)"
readme = "README.md"
authors = [
    { name = "huozhegrok", email = "huozhe.grok@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.16.3",
    "types-pyyaml==6.0.12.20260815",
]

[project.scripts]
agentd = "agentd.__main__:main"
agentctl = "agentctl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentd", "src/agentctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# #134: extend the default set with the codes the tree already noqas.
# `select` would drop F821/E9. RUF100 is now load-bearing: every
# leftover unused-noqa names a code this list enables.
extend-select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ARG001",
    "ARG005",
    "BLE001",
    "E402",
    "N802",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# #134: a test fake takes arguments it does not use and does not annotate.
# That is what a fake is. Scoped to tests/, not a blanket. src still
# enforces ANN/ARG. Argue with this list if that judgement is wrong.
"tests/*" = ["ANN001", "ANN002", "ANN003", "ARG001", "ARG005"]
