# agentd LaunchAgent logs — install (as root) after substituting REPLACE:
#   sudo cp packaging/newsyslog.agentd.conf /etc/newsyslog.d/agentd.conf
#   sudo newsyslog -nvv   # dry-run
#
# size is kilobytes. Flag N: do not signal syslogd (launchd-managed files).
# logfilename                           [owner:group] mode count size when flags
/Users/REPLACE/.agentd/logs/gateway.log              644  5   1024 *    N
/Users/REPLACE/.agentd/logs/gateway.err.log          644  5   1024 *    N
