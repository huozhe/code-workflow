# #131 / §8.4: the PR check. No Docker.
#
# Decision (measured on this host): Docker costs 6 tests and ~3× wall clock
# (452/1 in ~28s vs 446/7 in 8.5s). GHA runners have Docker, so we put a
# failing `docker` stub first on PATH. The six image/supervisor tests then
# take the existing skip path (`docker info` non-zero). The seventh skip is
# test_m4a_branch_protection_live.py (AGENTD_LIVE_M4A) — do not set that.
#
# The stub only covers PATH. docker_wait.docker_socket_ready talks to
# /var/run/docker.sock directly and ignores PATH. Nothing under tests/
# calls it today. A future test that does will not skip on GHA.
#
# Image regressions (#130 CLI pins) are covered by image.yml, path-filtered
# on docker/session-runner/**, the pin test, conftest.py (the build), and
# supervisor.py (the IMAGE tag).
#
# Do not add this check to config.yaml required_checks or the main ruleset
# until it has been green and stable. Wiring it earlier blocks every merge.

name: pr

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agentd
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Hide docker
        run: |
          mkdir -p "$HOME/bin-nodocker"
          printf '#!/bin/sh\nexit 1\n' > "$HOME/bin-nodocker/docker"
          chmod +x "$HOME/bin-nodocker/docker"
          echo "$HOME/bin-nodocker" >> "$GITHUB_PATH"
      - run: uv sync --all-extras
      - run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentd
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: ruff
        run: uv run ruff check src tests

  types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentd
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: mypy
        run: uv run mypy src
