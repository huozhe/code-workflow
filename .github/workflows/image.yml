# #131: image check. Path-filtered, not schedule, not label.
#
# Fires when the session-runner image, its pin test, the build fixture, or
# the image tag change. A schedule runs on days nothing changed; a label
# relies on someone remembering. A path filter cannot be forgotten.
#
# This job builds the image (git from source + two agent CLIs). That is
# why it is not on the PR path.

name: image

on:
  pull_request:
    paths:
      - "agentd/docker/session-runner/**"
      - "agentd/tests/test_image_agent_clis.py"
      - "agentd/tests/test_image_role_privilege_boundary.py"
      - "agentd/tests/test_adr35_kill_in_image.py"
      - "agentd/tests/probes/**"
      - "agentd/tests/conftest.py"
      - "agentd/src/agentd/supervisor.py"
      - ".github/workflows/image.yml"
  push:
    branches: [main]
    paths:
      - "agentd/docker/session-runner/**"
      - "agentd/tests/test_image_agent_clis.py"
      - "agentd/tests/test_image_role_privilege_boundary.py"
      - "agentd/tests/test_adr35_kill_in_image.py"
      - "agentd/tests/probes/**"
      - "agentd/tests/conftest.py"
      - "agentd/src/agentd/supervisor.py"
      - ".github/workflows/image.yml"

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agentd
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      # Every test that needs Docker runs here, because pr.yml stubs `docker`
      # and these skip there. ADR-35's kill fixture had never run in CI at all
      # since #199 added it (#244) — a fixture no job runs is not a guard.
      - run: >
          uv run pytest -q
          tests/test_image_agent_clis.py
          tests/test_image_role_privilege_boundary.py
          tests/test_adr35_kill_in_image.py
